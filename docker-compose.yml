# Dev thường chỉ cần: docker compose up -d db mailpit
# Chạy cả backend + frontend trong container: docker compose --profile app up -d --build
# (đặt JWT_ACCESS_SECRET và INTERNAL_API_SECRET, >= 32 ký tự, trong .env ở thư mục gốc hoặc môi trường shell)
services:
  db:
    image: postgres:17
    restart: unless-stopped
    # /dev/shm mặc định 64MB: truy vấn phân tích chạy song song (parallel hash join) hết bộ nhớ chia sẻ
    # với dữ liệu lớn và lỗi "could not resize shared memory segment" (D-054).
    shm_size: 256mb
    environment:
      POSTGRES_USER: beanbox
      POSTGRES_PASSWORD: beanbox
      POSTGRES_DB: beanbox
    ports:
      # Chỉ bind loopback: không lộ Postgres ra mạng ngoài
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beanbox -d beanbox']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Web UI

  backend:
    profiles: ['app']
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://beanbox:beanbox@db:5432/beanbox
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
      # Phải đặt (>= 32 ký tự) khi chạy profile app, nếu không backend sẽ dừng ngay khi khởi động
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      HOST: 0.0.0.0
      TRUST_PROXY: uniquelocal
      # Bắt buộc khi NODE_ENV=production: nếu để trống backend dừng ngay khi khởi động. Không dùng `:?` vì
      # compose nội suy cả service của profile chưa bật, sẽ làm hỏng `docker compose up -d db mailpit`.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      # D-063: bắt buộc khi NODE_ENV=production (32 byte: openssl rand -base64 32); khóa mẫu dev bị từ chối.
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      REQUIRE_ADMIN_2FA: ${REQUIRE_ADMIN_2FA:-false}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
    ports:
      # Bind 127.0.0.1: máy khác không gọi thẳng cổng 4000 để giả X-Forwarded-For / vượt rate limit
      - '127.0.0.1:4000:4000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    profiles: ['app']
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:4000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://backend:4000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  pgdata:
