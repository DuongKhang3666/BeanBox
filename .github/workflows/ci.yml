name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: beanbox
          POSTGRES_PASSWORD: ci-pg-password
          POSTGRES_DB: beanbox_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beanbox -d beanbox_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Chuỗi giả chỉ dành cho CI, không dùng ở môi trường thật.
      DATABASE_URL: postgresql://beanbox:ci-pg-password@localhost:5432/beanbox_ci
      SHADOW_DATABASE_URL: postgresql://beanbox:ci-pg-password@localhost:5432/beanbox_shadow
      TEST_DATABASE_URL: postgresql://beanbox:ci-pg-password@localhost:5432/beanbox_test
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdefghijklmnop
      INTERNAL_API_SECRET: ci-only-internal-0123456789abcdefghijklm
      PGPASSWORD: ci-pg-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Tạo DB shadow và DB test trống
        run: |
          psql -h localhost -U beanbox -d beanbox_ci -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE beanbox_shadow' \
            -c 'CREATE DATABASE beanbox_test'
      - name: Áp migration lên DB trống
        run: npx prisma migrate deploy
      - name: Kiểm drift giữa migrations và schema.prisma
        # Prisma 7: shadow DB lấy từ SHADOW_DATABASE_URL qua backend/prisma.config.ts (không còn cờ --shadow-database-url)
        run: |
          set +e
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::error::schema.prisma khác với migrations (drift). Hãy tạo migration mới (prisma migrate dev)."
            exit 1
          fi
          exit "$code"
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Chạy test kèm coverage (ngưỡng ở vitest.config.ts, D-055); tụt dưới ngưỡng thì job fail.
      - run: npm run test:coverage
      - name: Tóm tắt coverage backend
        if: ${{ !cancelled() }}
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e "
            const t = JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8')).total;
            const rows = ['statements', 'branches', 'functions', 'lines'].map(
              (k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |',
            );
            console.log(['### Coverage backend', '', '| Chỉ số | Tỷ lệ | Số lượng |', '|---|---|---|', ...rows, ''].join(String.fromCharCode(10)));
          " >> "$GITHUB_STEP_SUMMARY"
      - name: Upload báo cáo coverage backend (html)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Tóm tắt coverage frontend
        if: ${{ !cancelled() }}
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e "
            const t = JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8')).total;
            const rows = ['statements', 'branches', 'functions', 'lines'].map(
              (k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |',
            );
            console.log(['### Coverage frontend', '', '| Chỉ số | Tỷ lệ | Số lượng |', '|---|---|---|', ...rows, ''].join(String.fromCharCode(10)));
          " >> "$GITHUB_STEP_SUMMARY"
      - name: Upload báo cáo coverage frontend (html)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: beanbox
          POSTGRES_PASSWORD: ci-pg-password
          POSTGRES_DB: beanbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beanbox -d beanbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
    env:
      # Giá trị giả chỉ dành cho CI. Playwright webServer kế thừa các biến này.
      DATABASE_URL: postgresql://beanbox:ci-pg-password@localhost:5432/beanbox
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdefghijklmnop
      INTERNAL_API_SECRET: ci-only-internal-0123456789abcdefghijklm
      # D-063: khóa AES-256 giả (32 byte ASCII "ci-only-totp-key-0123456789abcde") cho secret 2FA của E2E.
      TOTP_ENCRYPTION_KEY: Y2ktb25seS10b3RwLWtleS0wMTIzNDU2Nzg5YWJjZGU=
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      GENERAL_RATE_LIMIT_PER_MIN: "1000"
      AUTH_RATE_LIMIT_PER_MIN: "30"
      ORDER_RATE_LIMIT_PER_MIN: "200"
      COUPON_RATE_LIMIT_PER_MIN: "200"
      QUOTE_RATE_LIMIT_PER_MIN: "200"
      SEED_ADMIN_PASSWORD: CiAdmin12345
      SEED_STAFF_PASSWORD: CiStaff12345
      SEED_CUSTOMER_PASSWORD: CiCustomer12345
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Cài phụ thuộc backend
        working-directory: backend
        run: npm ci
      - name: Cài phụ thuộc frontend
        working-directory: frontend
        run: npm ci
      - name: Chuẩn bị DB (generate, migrate, seed)
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run prisma:seed
      - name: Cài Chromium cho Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Chạy E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload báo cáo Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Quét lịch sử git bằng gitleaks
        run: |
          docker run --rm --entrypoint sh \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks:v8.30.0 \
            -c 'git config --global --add safe.directory /repo && gitleaks git --config /repo/.gitleaks.toml --redact --no-banner --verbose /repo'

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit (chỉ báo cáo, không làm fail)
        continue-on-error: true
        run: |
          {
            echo "## npm audit (mức high trở lên)"
            for dir in backend frontend; do
              echo ""
              echo "### $dir"
              echo '```'
              (cd "$dir" && npm audit --audit-level=high 2>&1) || true
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # DB tạm cho selftest-offsite.sh (pg_dump thật). Giá trị giả chỉ dành cho CI.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: beanbox
          POSTGRES_PASSWORD: ci-pg-password
          POSTGRES_DB: beanbox_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beanbox -d beanbox_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image backend
        run: docker build --target runtime -t beanbox-backend:ci backend
      - name: Build image frontend
        run: docker build -t beanbox-frontend:ci frontend
      - name: Build image Caddy
        run: docker build -t beanbox-caddy:ci deploy/caddy
      - name: Build image backup
        run: docker build -t beanbox-backup:ci deploy/backup
      - name: Smoke image backup (rclone, age, pg_dump)
        run: >-
          docker run --rm --entrypoint sh beanbox-backup:ci
          -c 'rclone version && age --version && pg_dump --version'
      # D-067: Trivy chỉ BÁO CÁO (không chặn CI): HIGH/CRITICAL đã có bản vá, ghi bảng vào Job Summary.
      - name: Cache cơ sở dữ liệu Trivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Trivy quét image backend/frontend (chỉ báo cáo)
        continue-on-error: true
        timeout-minutes: 8
        env:
          # Ghim phiên bản + digest; Dependabot không cập nhật tham chiếu này, nâng tay khi cần.
          TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          mkdir -p "$HOME/.cache/trivy"
          echo "## Trivy (HIGH/CRITICAL đã có bản vá, chỉ báo cáo)" >> "$GITHUB_STEP_SUMMARY"
          for img in beanbox-backend:ci beanbox-frontend:ci; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 0 --no-progress --scanners vuln --format json --quiet "$img" \
              > "$RUNNER_TEMP/trivy.json" || echo '{}' > "$RUNNER_TEMP/trivy.json"
            IMG="$img" TRIVY_JSON="$RUNNER_TEMP/trivy.json" node -e "
              const j = JSON.parse(require('fs').readFileSync(process.env.TRIVY_JSON, 'utf8'));
              const rows = [];
              for (const r of j.Results || []) {
                for (const v of r.Vulnerabilities || []) {
                  rows.push([v.PkgName, v.InstalledVersion, v.FixedVersion || '', v.VulnerabilityID, v.Severity]);
                }
              }
              const n = (s) => rows.filter((r) => r[4] === s).length;
              const out = ['', '### ' + process.env.IMG, '', 'CRITICAL: ' + n('CRITICAL') + ' · HIGH: ' + n('HIGH'), ''];
              if (rows.length > 0) {
                out.push('| Gói | Đang dùng | Bản vá | CVE | Mức |', '|---|---|---|---|---|');
                for (const r of rows.slice(0, 40)) out.push('| ' + r.join(' | ') + ' |');
                if (rows.length > 40) out.push('', '(còn ' + (rows.length - 40) + ' dòng nữa, xem log bước này)');
              }
              console.log(out.join(String.fromCharCode(10)));
            " >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Selftest backup off-site (D-043)
        timeout-minutes: 5
        run: >-
          docker run --rm --network host
          -e PGHOST=localhost -e PGPORT=5432 -e PGUSER=beanbox
          -e PGPASSWORD=ci-pg-password -e PGDATABASE=beanbox_ci
          -v "$GITHUB_WORKSPACE/deploy/backup:/deploy/backup:ro"
          --entrypoint sh beanbox-backup:ci /deploy/backup/selftest-offsite.sh

  ops-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck (deploy/backup, deploy/monitoring)
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0
          -s sh deploy/backup/*.sh deploy/monitoring/check.sh
      - name: docker compose config (prod) với env giả
        run: |
          # Giá trị giả chỉ dùng cho CI, không phải secret thật.
          cat > "$RUNNER_TEMP/ci.env" <<'ENVEOF'
          PUBLIC_URL=https://ci-only.example.test
          SITE_ADDRESS=ci-only.example.test
          POSTGRES_USER=ci_only_user
          POSTGRES_DB=ci_only_db
          POSTGRES_PASSWORD=ci-only-not-a-real-password
          JWT_ACCESS_SECRET=ci-only-not-a-real-jwt-secret-0123456789
          INTERNAL_API_SECRET=ci-only-not-a-real-internal-secret-0123456789
          TOTP_ENCRYPTION_KEY=Y2ktb25seS10b3RwLWtleS0wMTIzNDU2Nzg5YWJjZGU=
          ENVEOF
          docker compose -f docker-compose.prod.yml --env-file "$RUNNER_TEMP/ci.env" config -q
          docker compose -f docker-compose.prod.yml --env-file "$RUNNER_TEMP/ci.env" \
            --profile backup --profile tools config -q
      - name: docker compose config (demo một lệnh, D-066)
        run: docker compose -f docker-compose.demo.yml config -q
