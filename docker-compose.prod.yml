# Production / demo trên VPS (D-025). Biến lấy từ .env.production:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Chỉ service `caddy` publish cổng ra ngoài; db/backend/frontend chỉ nằm trong mạng Docker nội bộ.
name: beanbox-prod

# Giới hạn tài nguyên (D-058): ƯỚC LƯỢNG cho VPS 2 vCPU / 2 GB, CHƯA ĐO trên VPS thật. Tổng `mem_limit`
# 1632m, chừa ~400 MB cho hệ điều hành và Docker. `cpus` là trần, không phải đặt trước. Backend vượt
# `mem_limit` sẽ bị OOM-kill rồi `restart: unless-stopped` khởi động lại; nếu xuất CSV lớn (1000 dòng
# tồn kho) hoặc build ảnh bị kill thì tăng giá trị tương ứng. Đo bằng `docker stats` sau khi deploy.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  db:
    image: postgres:17
    restart: unless-stopped
    init: true
    # /dev/shm mặc định 64MB: truy vấn phân tích chạy song song (parallel hash join) hết bộ nhớ chia sẻ
    # với dữ liệu lớn và lỗi "could not resize shared memory segment" (D-054).
    shm_size: 256mb
    mem_limit: 640m # ước lượng, chưa đo trên VPS thật (gồm cả /dev/shm 256mb)
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Đặt POSTGRES_USER trong .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?Đặt POSTGRES_DB trong .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '4000'
      TRUST_PROXY: uniquelocal
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Đặt JWT_ACCESS_SECRET (>= 32 ký tự) trong .env.production}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Đặt INTERNAL_API_SECRET (>= 32 ký tự) trong .env.production}
      WEB_APP_URL: ${PUBLIC_URL:?Đặt PUBLIC_URL (https://domain) trong .env.production}
      FRONTEND_ORIGINS: ${PUBLIC_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # D-056: để trống = SMTP_SECURE false, SMTP_REQUIRE_TLS true (production)
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
      MAIL_FROM: ${MAIL_FROM:-BeanBox <no-reply@beanbox.local>}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CONTACT_RETENTION_DAYS: ${CONTACT_RETENTION_DAYS:-365}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GENERAL_RATE_LIMIT_PER_MIN: ${GENERAL_RATE_LIMIT_PER_MIN:-100}
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-5}
      ORDER_RATE_LIMIT_PER_MIN: ${ORDER_RATE_LIMIT_PER_MIN:-10}
      COUPON_RATE_LIMIT_PER_MIN: ${COUPON_RATE_LIMIT_PER_MIN:-10}
      QUOTE_RATE_LIMIT_PER_MIN: ${QUOTE_RATE_LIMIT_PER_MIN:-30}
      EXPORT_RATE_LIMIT_PER_MIN: ${EXPORT_RATE_LIMIT_PER_MIN:-10}
      # D-057 (đơn COD khách vãng lai) và D-058 (pool/timeout analytics); để trống = mặc định
      GUEST_COD_HOLD_HOURS: ${GUEST_COD_HOLD_HOURS:-}
      GUEST_COD_MAX_OPEN: ${GUEST_COD_MAX_OPEN:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
      ANALYTICS_POOL_MAX: ${ANALYTICS_POOL_MAX:-}
      ANALYTICS_STATEMENT_TIMEOUT_MS: ${ANALYTICS_STATEMENT_TIMEOUT_MS:-}
    volumes:
      - uploads:/app/uploads
    mem_limit: 448m # ước lượng, chưa đo trên VPS thật
    cpus: 1.0
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        # Cố định lúc build: đổi domain thì phải build lại image frontend
        API_INTERNAL_URL: http://backend:4000
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL:?Đặt PUBLIC_URL (https://domain) trong .env.production}
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://backend:4000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Đặt INTERNAL_API_SECRET trong .env.production}
    mem_limit: 320m # ước lượng, chưa đo trên VPS thật
    cpus: 0.75
    logging: *default-logging

  caddy:
    build:
      context: ./deploy/caddy
    restart: unless-stopped
    init: true
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Cổng host = cổng container và Caddy tự biết cổng đó (http_port/https_port trong Caddyfile) nên redirect
    # http -> https giữ đúng cổng khi khác 80/443. Production thật để mặc định 80/443 (Let's Encrypt cần 80/443).
    ports:
      - '${HTTP_PORT:-80}:${HTTP_PORT:-80}'
      - '${HTTPS_PORT:-443}:${HTTPS_PORT:-443}'
      - '${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp'
    environment:
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      SITE_ADDRESS: ${SITE_ADDRESS:?Đặt SITE_ADDRESS (domain, hoặc localhost để thử) trong .env.production}
      ACME_EMAIL: ${ACME_EMAIL:-}
      EDGE_RATE_AUTH_PER_MIN: ${EDGE_RATE_AUTH_PER_MIN:-30}
      EDGE_RATE_API_PER_MIN: ${EDGE_RATE_API_PER_MIN:-300}
      EDGE_RATE_WEB_PER_MIN: ${EDGE_RATE_WEB_PER_MIN:-600}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Admin API của Caddy chỉ nghe 127.0.0.1 trong container, không publish ra ngoài.
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:2019/config/ >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 96m # ước lượng, chưa đo trên VPS thật
    cpus: 0.25
    logging: *default-logging

  # Sao lưu hằng ngày (D-034) + off-site tùy chọn (M8). Bật: docker compose ... --profile backup up -d backup
  # Image build từ deploy/backup (postgres:17 + rclone ghim phiên bản (D-041) + age + curl). Cấu hình off-site nằm trong file RIÊNG
  # `.env.backup` (gitignored, mẫu `.env.backup.example`), KHÔNG nạp .env.production vào container này.
  # Đổi đường dẫn file bằng biến BACKUP_ENV_FILE; file không có thì off-site tắt (cần compose >= 2.24).
  backup:
    profiles: ['backup']
    build:
      context: ./deploy/backup
    image: beanbox-backup:local
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?Đặt POSTGRES_USER trong .env.production}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env.production}
      PGDATABASE: ${POSTGRES_DB:?Đặt POSTGRES_DB trong .env.production}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    env_file:
      - path: ${BACKUP_ENV_FILE:-.env.backup}
        required: false
    entrypoint: ['sh', '/deploy/backup/loop.sh']
    volumes:
      - ./deploy/backup:/deploy/backup:ro
      - ./backups:/backups
      - uploads:/app/uploads:ro
    mem_limit: 128m # ước lượng, chưa đo trên VPS thật (pg_dump + rclone)
    cpus: 0.25
    logging: *default-logging

  # Seed dữ liệu demo (D-031): docker compose ... --profile tools run --rm seed
  seed:
    profiles: ['tools']
    build:
      context: ./backend
      target: tools
    restart: 'no'
    init: true
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Đặt JWT_ACCESS_SECRET trong .env.production}
      SEED_ALLOW_PRODUCTION: 'true'
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Đặt INTERNAL_API_SECRET trong .env.production}
      # Không dùng `:?` ở đây vì compose nội suy cả service của profile chưa bật; seed tự từ chối nếu thiếu/yếu
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-}
    logging: *default-logging

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
