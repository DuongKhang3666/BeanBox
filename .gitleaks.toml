# Cấu hình gitleaks cho BeanBox (D-033). Chạy trong CI bằng Docker image ghim phiên bản.
# Chỉ allowlist các giá trị mẫu/giả đã biết, theo cặp (đường dẫn + giá trị). KHÔNG allowlist cả thư mục.
title = "BeanBox gitleaks"

[extend]
useDefault = true

# Giá trị mẫu dev trong file .env.example (không phải bí mật thật).
[[allowlists]]
description = "Giá trị mẫu dev trong .env.example"
condition = "AND"
paths = ['''^(backend|frontend)/\.env\.example$''']
regexes = [
  '''dev-only-secret-change-me-[0-9a-f]+''',
  '''dev-internal-secret-change-me-[0-9a-f]+''',
  '''(Admin|Staff|Customer)12345''',
]

# Chuỗi giả dùng trong CI (chỉ để chạy test, không dùng ở môi trường thật).
[[allowlists]]
description = "Chuỗi giả của workflow CI"
condition = "AND"
paths = ['''^\.github/workflows/ci\.yml$''']
regexes = ['''ci-only-[A-Za-z0-9-]+''']

# Fixture test: khóa/chữ ký giả, từng bị rule generic/stripe bắt nhầm (đã rà soát, không phải bí mật thật).
[[allowlists]]
description = "Fixture test: secret VNPay giả"
condition = "AND"
paths = ['''^backend/tests/securityHardening\.integration\.test\.ts$''']
regexes = ['''vnpay-test-secret-0123456789''', '''CHUKY-BI-MAT-XYZ-456''']

[[allowlists]]
description = "Fixture test: khóa Stripe live giả (kiểm tra backend từ chối sk_live_)"
condition = "AND"
paths = ['''^backend/tests/paymentsConfig\.test\.ts$''']
regexes = ['''sk_live_FAKEFAKEFAKE''']

[[allowlists]]
description = "Fixture test: INTERNAL_API_SECRET giả cho môi trường test"
condition = "AND"
paths = ['''^backend/tests/testEnv\.ts$''']
regexes = ['''test-internal-secret-0123456789abcdefghij''']

# D-063: khóa AES-256 giả/mẫu cho 2FA (TOTP_ENCRYPTION_KEY), chỉ dùng localhost/CI/test; production từ chối khóa mẫu dev.
[[allowlists]]
description = "Khóa TOTP mẫu dev (base64 của chuỗi ASCII beanbox-dev-...) trong .env.example, test và cấu hình E2E"
condition = "AND"
paths = [
  '''^backend/\.env\.example$''',
  '''^backend/tests/testEnv\.ts$''',
  '''^frontend/playwright\.config\.ts$''',
]
regexes = ['''YmVhbmJveC1kZXYtdG90cC1rZXktbG9jYWxob3N0ISE=''']

[[allowlists]]
description = "Khóa TOTP giả của workflow CI (base64 của chuỗi ASCII ci-only-...)"
condition = "AND"
paths = ['''^\.github/workflows/ci\.yml$''']
regexes = ['''Y2ktb25seS10b3RwLWtleS0wMTIzNDU2Nzg5YWJjZGU=''']

# Fixture test: chuỗi base32 giả "ABCDEF234567" làm secret otpauth (kiểm tra dựng URI), không phải bí mật thật.
[[allowlists]]
description = "Fixture test: secret base32 giả cho buildOtpauthUri"
condition = "AND"
paths = ['''^backend/tests/totp\.test\.ts$''']
regexes = ['''ABCDEF234567''']

# D-066: giá trị công khai của demo một lệnh (tiền tố demo-only-/Demo-only-), chỉ dùng trên máy local, không phải bí mật thật.
[[allowlists]]
description = "Giá trị demo công khai trong docker-compose.demo.yml và tài liệu demo"
condition = "AND"
paths = [
  '''^docker-compose\.demo\.yml$''',
  '''^README\.md$''',
  '''^docs/(decisions|deployment|testing|wave3-plan)\.md$''',
]
regexes = [
  '''[Dd]emo-only-[A-Za-z0-9-]+''',
  '''ZGVtby1vbmx5LXRvdHAta2V5LTAxMjM0NTY3ODlhYmM=''',
]
